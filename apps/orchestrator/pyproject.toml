[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-orchestrator"
version = "0.1.0"
description = "FastAPI orchestration core for a Korean voice agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=41,<51",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-httpx>=0.51b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.30,<1",
    "wsproto>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
python_files = ["*.test.py"]
pythonpath = ["src"]
testpaths = ["../../tests/units/orchestrator/testcodes"]
